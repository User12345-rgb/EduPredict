{% extends "base.html" %}{% block title %}Crear cuenta · EduPredict{% endblock %}{% block content %}<section class="form-card"><p class="eyebrow">NUEVA CUENTA</p><h1>Crear cuenta</h1><form method="post">{{ form.csrf_token if form else '' }}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre visible</label><input name="display_name" required maxlength="100"><label>Identificador</label><input name="username" required maxlength="40" autocomplete="username"><label>Contraseña (mínimo 8 caracteres)</label><input type="password" name="password" required minlength="8" autocomplete="new-password"><label>Tipo de cuenta</label><select name="role"><option value="alumno">Alumno</option><option value="docente">Docente (requiere autorización)</option></select><button class="btn">Crear cuenta</button></form><p class="muted">No uses tu matrícula ni contraseñas de cuentas escolares.</p></section>{% endblock %}
