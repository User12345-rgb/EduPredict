{% extends "base.html" %}{% block title %}Crear materia · EduPredict{% endblock %}{% block content %}<section class="form-card wide"><p class="eyebrow">CONFIGURACIÓN DOCENTE</p><h1>Crear materia</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre de la materia</label><input name="subject_name" required maxlength="100"><label>Semestre</label><select name="semester">{% for n in range(1,7) %}<option value="{{ n }}">{{ n }}° semestre</option>{% endfor %}</select><label>Grupo u oferta</label><input name="group_name" placeholder="Ej. 305"><h3>Criterios y porcentajes</h3><p class="muted">Los porcentajes deben sumar 100%. Ejemplo: actividades 30, proyecto 40, examen 20, participación 10.</p><div id="criteria"><div class="criterion-row"><input name="criterion_name" placeholder="Criterio" required><input name="weight" type="number" min="0.01" max="100" step="0.01" placeholder="%" required></div><div class="criterion-row"><input name="criterion_name" placeholder="Criterio" required><input name="weight" type="number" min="0.01" max="100" step="0.01" placeholder="%" required></div></div><button type="button" class="small-btn secondary" onclick="addCriterion()">+ Agregar criterio</button><button class="btn">Guardar materia</button></form></section><script>function addCriterion(){const d=document.createElement('div');d.className='criterion-row';d.innerHTML='<input name="criterion_name" placeholder="Criterio" required><input name="weight" type="number" min="0.01" max="100" step="0.01" placeholder="%" required>';document.getElementById('criteria').appendChild(d)}</script>{% endblock %}
